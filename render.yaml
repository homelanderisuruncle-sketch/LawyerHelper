services:
  - type: web
    name: qada-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 main:app
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: DAILY_LIMIT
        value: "8"
      - key: MAX_FILE_MB
        value: "12"
